services:
  youtube-podcast-server:
    build: .
    image: youtube-podcast-server:latest
    container_name: youtube-podcast-server
    restart: unless-stopped
    # Published on the docker bridge address only: the cloudflared container reaches it
    # there, and nothing on the LAN can talk to the server over plain http.
    ports:
      - "172.17.0.1:5757:8080"
    # uid:gid 1000 inside and out; the two data folders must belong to it.
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - /DATA/AppData/youtube-podcast-server/downloads:/app/downloads
      - /DATA/AppData/youtube-podcast-server/state:/app/state
    environment:
      - TZ=America/Los_Angeles
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-https://podcast.maxrenke.com}
      - FEED_TITLE=YouTube Podcast
      - FEED_AUTHOR=Max Renke
      - POLL_INTERVAL_SECONDS=${POLL_INTERVAL_SECONDS:-3600}
      # Secret for POST/DELETE requests. Put API_TOKEN=... in a .env file next to this one.
      - API_TOKEN=${API_TOKEN:-}
      - AUDIO_QUALITY=${AUDIO_QUALITY:-5}
      - SUB_MAX_ITEMS=${SUB_MAX_ITEMS:-10}
      - KEEP_DAYS=${KEEP_DAYS:-0}
      - KEEP_COUNT=${KEEP_COUNT:-0}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-youtube.com,youtu.be,youtube-nocookie.com}
