<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>YouTube Podcast options</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 14px system-ui, sans-serif; padding: 12px; max-width: 520px; margin: 0;
         background: #fff; color: #15141a; }
  label { display: block; margin: 10px 0 4px; font-weight: 600; }
  input { font: inherit; width: 100%; box-sizing: border-box; padding: 6px 8px; color: inherit;
          background: #fff; border: 1px solid #8f8f9d; border-radius: 4px; }
  p.hint { font-size: 12px; color: #5b5b66; margin: 4px 0 0; }
  button { font: inherit; padding: 6px 14px; margin: 14px 8px 0 0; color: inherit; cursor: pointer;
           background: #f0f0f4; border: 1px solid #8f8f9d; border-radius: 4px; }
  button:hover { background: #e0e0e6; }
  :focus-visible { outline: 2px solid #0061e0; outline-offset: 1px; }
  #result { margin-top: 12px; min-height: 18px; }
  #result.error { color: #b00020; } #result.ok { color: #0a7d2b; }
  /* the dark colours of Firefox's own add-ons page, so the options panel blends in */
  @media (prefers-color-scheme: dark) {
    body { background: #2b2a33; color: #fbfbfe; }
    input { background: #1c1b22; border-color: #8f8f9d; }
    button { background: #42414d; border-color: #5b5b66; }
    button:hover { background: #52525e; }
    :focus-visible { outline-color: #00ddff; }
    p.hint { color: #bfbfc9; }
    #result.error { color: #ff848b; } #result.ok { color: #54ffbd; }
  }
</style>
</head>
<body>
  <label for="server">Server address</label>
  <input id="server" type="url" placeholder="https://podcast.example.com" spellcheck="false">
  <p class="hint">Where youtube-podcast-server is reachable from this browser.</p>

  <label for="token">API token</label>
  <input id="token" type="password" autocomplete="off" spellcheck="false">
  <p class="hint">The server's API_TOKEN. Stored in this browser profile only and sent to that server with add, subscribe and delete requests.</p>

  <button id="save">Save</button><button id="test">Test connection</button>
  <div id="result" role="status"></div>
  <p class="hint" id="version"></p>
  <script src="common.js"></script>
  <script src="options.js"></script>
</body>
</html>
